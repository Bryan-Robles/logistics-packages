spring:
  application:
    name: logistics-packages

  flyway:
    enabled: true

  cloud:
    aws:
      region:
        static: us-east-2
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localhost:4566
      s3:
        endpoint: http://localhost:4566
        # LocalStack needs path-style URLs (http://host:4566/bucket)
        path-style-access-enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

aws:
  s3:
    bucket-name: logistics-packages-local
    auto-create-bucket: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    flyway:
      enabled: true
