name: Reporte de bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasa y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a /admision
        2. ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte afectada
      options:
        - Backend
        - Frontend
        - Docker / entorno local
        - Documentación
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas
      description: Errores de consola, respuesta de la API o capturas de pantalla.
      render: shell
