name: Propuesta de mejora
description: Una mejora, refactor o documentación
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema o motivación
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Qué cambiarías y cómo.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
